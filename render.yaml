services:
  - type: web
    name: personal-pdf-analyzer-v3
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_PAGES
        value: "100"
      - key: MAX_OCR_PAGES
        value: "10"
      - key: OCR_DPI
        value: "110"
      - key: TEMP_DIR
        value: /tmp/pdf-analyzer
      - key: PDF_STORAGE_DIR
        value: /tmp/pdf-analyzer/uploads
      - key: MODEL_PATH
        value: /models/
      - key: PING_INTERVAL_MS
        value: "60000"
